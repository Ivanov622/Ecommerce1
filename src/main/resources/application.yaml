spring:
  application:
    name: ecom-application
  datasource: 
    url: jdbc:postgresql://localhost:5433/ecommerce1
    username: postgres
    password: 1234
   
  jpa:
    database: postgresql
    show-sql: true    
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect  
